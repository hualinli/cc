<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智慧监考系统</title>
    <!-- 引入 FontAwesome 图标 -->
    <link rel="stylesheet" href="/css/all.min.css">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img class="logo-image" src="/template/logo4.png" alt="智慧监考系统 Logo">
                <h2>智慧监考管理平台</h2>
                <p>请输入管理员账号和密码</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="field-label" for="username">账号</label>
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="请输入管理员账号" required
                        autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="field-label" for="password">密码</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="请输入管理员密码" required
                        autocomplete="current-password">
                </div>
                <button type="submit" id="loginBtn" class="login-btn">
                    <span class="btn-loader" style="display: none;"><i
                            class="fa-solid fa-circle-notch fa-spin"></i></span>
                    <span class="btn-text">登 录</span>
                </button>
            </form>

            <div id="errorBox" class="error-msg"></div>

            <div class="footer-text">
                &copy; 2026 智慧监考系统 版权所有
            </div>
        </div>
    </div>

    <!-- 离线引用本地 JS -->
    <script src="/js/login.js"></script>
</body>

</html>
